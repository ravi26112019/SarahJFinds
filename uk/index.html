<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sarah Johnson Finds</title>
    <link rel="stylesheet" href="/style.css?v=2">
    <link rel="icon" type="image/webp" href="/favicon.webp?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <div class="top-banner"></div>
        <div class="profile-section">
            <img src="/avatar.png?v=4" class="profile-pic" alt="Profile">
        </div>

        <section class="bio-card">
            <button class="bio-card__share-btn" onclick="sharePage()" aria-label="Share Page">
                <i class="fa-solid fa-arrow-up-from-bracket"></i>
            </button>

            <div class="bio-card__user-info">
                <h2 class="bio-card__title"> Sarah J. Finds </h2>
                <div class="sub-info">
                    <p class="bio-card__handle">@SarahJFinds</p>
                    <p class="bio-card__tag">Lifestyle & Finds | Amazon Influencer</p>
                    <p class="bio-card__desc">Sharing my absolute favorite Amazon finds & daily deals! 🚀</p>
                </div>
            </div>

            <section class="bio-card__links">
                <a class="bio-card__link-item" 
                    href="https://amzn.eu/d/0iKaTHCz">
                    Shop My Storefront
                </a>
                <a class="bio-card__link-item" 
                    href="https://www.amazon.co.uk/shop/sarahjfinds/list/PK3HHGYCZIS7?ref_=aipsflist&tag=sarahjohnso06-21">
                    My Kitchen Favourites
                </a>
                <a class="bio-card__link-item"
                    href="https://www.amazon.co.uk/shop/sarahjfinds/list/3J3K1BHDVQWTW?ref_=aipsflist&tag=sarahjohnso06-21">
                    Home Essentials
                </a>
                <a class="bio-card__link-item" 
                    href="https://amzn.eu/d/0iKaTHCz">
                    Top Viral Finds
                </a>
            </section>

            <section class="bio-card__socials">
                <a href="https://www.instagram.com/sarahjfinds">
                    <i class="fa-brands fa-instagram bio-card__social-icon"></i>
                </a>
                <a href="https://facebook.com/sarahjfinds">
                    <i class="fa-brands fa-facebook bio-card__social-icon"></i>
                </a>
                <a href="https://youtube.com/@SarahJFinds">
                    <i class="fa-brands fa-youtube bio-card__social-icon"></i>
                </a>
            </section>

            <span class="bio-card__disclosure">As an Amazon Associate I earn from qualifying purchases.</span>

            <footer class="bio-card__footer">
                <a href="https://www.amazon.com/shop/SarahJFinds" style="text-decoration: none; color: inherit;">
                  amazon.com/shop/SarahJFinds
                </a>
        </section>

        <script>
            function sharePage() {
                if (navigator.share) {
                    navigator.share({
                        title: document.title,
                        url: window.location.href
                    }).catch(err => console.log('Share canceled'));
                } else {
                    navigator.clipboard.writeText(window.location.href);
                    alert("Link copied to clipboard!");
                }
            }
        </script>
    </main>
</body>

</html>
